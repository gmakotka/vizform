        const container = document.getElementById('categories');
        if (!data || !data.length) {
          container.innerHTML = '<p class="text-muted" style="text-align:center;grid-column:1/-1">Нет категорий. Убедитесь, что SQL-схема выполнена в\u00a0Supabase.</p>';
          return;
        }
        container.innerHTML = data.map(cat => `
          <a href="form.html?cat=${cat.slug}" class="card">
            <div class="card__icon">${ICONS[cat.slug] || ICONS.technical}</div>
            <h3 class="card__title">${cat.name}</h3>
            <p class="card__desc">${cat.description || ''}</p>
            <div class="card__arrow">${ARROW}</div>
          </a>
        `).join('');
      } catch(e) {
        console.error('loadCategories error:', e);
        document.getElementById('categories').innerHTML = '<p class="text-muted" style="text-align:center;grid-column:1/-1">Ошибка загрузки: ' + (e.message || e) + '</p>';
      }
    }

    loadCategories();
  </script>
  <script>
function toggleTheme(){const h=document.documentElement,c=h.getAttribute('data-theme'),n=c==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('vizform_theme',n)}
(function(){const s=localStorage.getItem('vizform_theme');if(s==='dark'||(!s&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark')})();
</script>
</body>
</html>
