<body>

  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="header__logo">Viz<span>Form</span></a>
      <nav class="header__nav">
        <button class="theme-toggle" onclick="toggleTheme()" title="Сменить тему">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="container container--narrow">
    <!-- Form Header -->
    <div class="form-header" id="form-header">
      <button class="form-header__back" onclick="location.href='index.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1 class="form-header__title">Заявка на визуализацию</h1>
      <span class="form-header__cat" id="cat-badge"></span>
    </div>

    <!-- Dynamic Form -->
    <form id="viz-form" class="form-body" novalidate>
      <div id="fields-container">
        <p class="text-muted">Загрузка полей...</p>
      </div>

      <!-- Contact info -->
      <div class="contact-section">
        <h3 class="contact-section__title">Контактная информация</h3>
        <div class="field">
          <label class="field__label">Ваше имя <span class="req">*</span></label>
          <input type="text" class="field__input" id="submitter_name" placeholder="Иван Иванов" required>
          <div class="field__error">Укажите имя</div>
        </div>
        <div class="field">
          <label class="field__label">Email <span class="req">*</span></label>
          <input type="email" class="field__input" id="submitter_email" placeholder="ivan@company.com" required>
          <div class="field__error">Укажите корректный email</div>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--block" id="submit-btn">
        Отправить заявку
      </button>
    </form>

    <!-- Success Screen -->
    <div id="success-screen" class="success-screen hidden">
      <div class="success-screen__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h2 class="success-screen__title">Заявка отправлена!</h2>
      <p class="success-screen__text">Мы получили ваше техническое задание и свяжемся с вами в ближайшее время.</p>
      <a href="index.html" class="btn btn--outline">Вернуться на главную</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/runtime-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/form.js"></script>
  <script>
function toggleTheme(){const h=document.documentElement,c=h.getAttribute('data-theme'),n=c==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('vizform_theme',n)}
(function(){const s=localStorage.getItem('vizform_theme');if(s==='dark'||(!s&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark')})();
</script>
</body>
</html>
